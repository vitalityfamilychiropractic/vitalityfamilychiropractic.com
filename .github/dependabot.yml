version: 2
updates:
  - package-ecosystem: "bun"
    directory: "/"
    target-branch: "preview"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "preview"
    schedule:
      interval: "weekly"
